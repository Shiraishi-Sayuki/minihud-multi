modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPLv3"

[[mods]]
modId = "minihud"
version = "${mod_version}"
displayName = "MiniHUD"
displayURL = "https://github.com/maruohon/minihud"
logoFile = "assets/minihud/icon.png"
credits = "masa"
authors = "masa, Shiraishi-Sayuki (multiloader port)"
description = '''
Various client-side HUD-related information overlays in one mod.
'''

[[mixins]]
config = "mixins.minihud.json"

[[dependencies.minihud]]
modId = "neoforge"
mandatory = true
versionRange = "[21.0.0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.minihud]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21,1.22)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.minihud]]
modId = "malilib"
mandatory = true
versionRange = "[0.21,)"
ordering = "AFTER"
side = "CLIENT"
